<!DOCTYPE html>
<html>

<head>
    <title>Chart.js</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <div class="max-w-3xl mx-auto py-5 flex">

        <div class="flex-1">


            <h1 class="text-xl font-bold mb-3">
                Has either of your parents/guardians ever attended a university or college?
            </h1>
            <div class="w-[50%] mx-auto mb-3">
                <canvas id="myChart"></canvas>
            </div>

            <h1 class="text-xl font-bold mb-3">
                Revenue and Expenses, 2020-2025
            </h1>
            <div class="mx-auto">
                <canvas id="chart_business"></canvas>
            </div>

            <h1 class="text-xl font-bold mb-3">
                Domestic Enrollment Comparison
            </h1>
            <div class="mx-auto">
                <canvas id="chart_count"></canvas>
            </div>

        </div>
        <div class="flex-1 text-center">
            <h1 class="text-xl font-bold mb-3 text-center">
                Canada's exports ($B / yr)

            </h1>

            <main class="text-center justify-center cursor-none"></main>

        </div>

    </div>




    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
    <script src="script.js"></script>
    <script src="viz.js"></script>

</body>

</html>
